pre-commit:
  jobs:
    - name: gitleaks secret scan
      run: gitleaks protect --staged --no-banner --redact=50 --verbose

    - name: bandit python security
      glob: "*.py"
      run: ./.venv/Scripts/python.exe -m bandit -r --severity-level medium {staged_files} || true

    - name: lint python
      glob: "*.py" # glob filter
      run: ./.venv/Scripts/python.exe -m ruff check --config ./ruff.pre-commit.toml {staged_files}

    - name: lint web
      root: web/
      glob: "web/**/*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint bootstrap installer
      root: apps/bootstrap-installer/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint desktop app
      root: apps/desktop/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint tui
      root: ui-tui/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint shared
      root: apps/shared/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint tests
      root: tests-js/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}
